services:
  - type: web
    name: ometalk
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_SHEETS_FEEDBACK_URL
        sync: false
      - key: GOOGLE_SHEETS_FEEDBACK_TOKEN
        sync: false